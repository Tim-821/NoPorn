# ============================================================
# Flight · 策略文件（v3 · DNS 主力版）
#
# 由 root 所有（root:wheel 644），应用只读。
# 应用生成最终配置的最后一步，用这里的 dns 覆盖掉订阅、
# Merge、Script、规则编辑器里的一切写法。
# ============================================================
#
# 【拦截原理】
#
# AdGuard Family DNS 由 AdGuard 公司实时维护成人内容库。
# 命中它的域名不返回真实 IP，而是返回固定哨兵地址：
#     94.140.14.35（AdGuard 拦截页）
# 部分条目返回 0.0.0.0。
#
# 下面两条 IP 规则 = 一条动态黑名单：名单在 AdGuard 服务器上
# 天天更新，本地不维护任何关键词，只要 DNS 返回哨兵地址，
# 连接就在这里被掐断。
#
# 【为什么必须走代理】
# 明文 UDP 53 出境前会被抢答（返回伪造 IP），所以不留明文解析器。
# DoH 必须从代理隧道出去，否则一样被抢答。
#
# 【鸡蛋问题】
# DoH 要走代理 -> 代理节点的域名要先解析 -> 若仍用 DoH 就死锁。
# 所以 proxy-server-nameserver 单独指定国内 DNS 解析节点域名。
# ============================================================

rules:
  # --- 动态层：AdGuard 拦截哨兵 -> 直接断开 ---
  - IP-CIDR,94.140.14.35/32,REJECT
  - IP-CIDR,0.0.0.0/32,REJECT

  # --- 兜底层：给自带 DoH 的浏览器（不走本机 DNS）留一道墙 ---
  # category-porn 是上游社区维护的分类库，不是关键词匹配
  - GEOSITE,category-porn,REJECT

dns:
  enable: true
  ipv6: false
  listen: 127.0.0.1:1053
  enhanced-mode: redir-host

  # 把 DoH 域名钉死到已知 IP，避免"解析 DNS 服务器自己"时被污染
  hosts:
    'family.adguard-dns.com':
      - 94.140.14.15
      - 94.140.15.16

  # 仅用于解析 DoH 服务器域名，必须是 IP
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 解开鸡蛋问题：代理节点域名用国内 DNS 解析
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 唯一解析器：AdGuard Family，且强制从代理隧道出去
  nameserver:
    - 'https://family.adguard-dns.com/dns-query#自动选择'

  # 国内域名照旧走国内 DNS，保证速度、避免解析到国外 CDN
  nameserver-policy:
    'geosite:cn,private':
      - 223.5.5.5
      - 119.29.29.29
    '+.cn':
      - 223.5.5.5
      - 119.29.29.29
